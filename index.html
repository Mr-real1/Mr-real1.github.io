
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe Online</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#0c1020;color:white;font-family:Arial,sans-serif}
main{max-width:650px;margin:auto}
h1{text-align:center;color:#91aaff}
.card{background:#171d33;padding:18px;border-radius:18px;margin:15px 0}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #445071;background:#0f1528;color:white;margin:8px 0}
button{padding:13px;border:0;border-radius:10px;background:#718cff;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.actions{display:flex;gap:10px;margin:10px 0}
.actions button{flex:1}
.hidden{display:none!important}
.hint{color:#aab4d0;font-size:13px}
.roomcode{font-size:27px;letter-spacing:6px;color:#b9caff;font-weight:bold}
.players{display:flex;gap:10px}
.player{flex:1;text-align:center;background:#10172b;padding:12px;border-radius:12px}
.active{outline:2px solid #65dfad}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:390px;margin:18px auto}
.cell{aspect-ratio:1;font-size:55px;background:#263252;color:white}
.x{color:#79a0ff}.o{color:#ff9bd1}
.status{text-align:center;background:#10172b;padding:15px;border-radius:12px}
.chatlog{height:200px;overflow:auto;background:#0f1528;padding:12px;border-radius:12px}
.msg{padding:9px;margin:6px 0;background:#263252;border-radius:10px;overflow-wrap:anywhere}
.mine{text-align:right;background:#354a83}
.emoji{font-size:20px;padding:8px;background:#263252;margin:3px}
</style>
</head>
<body>
<main>
<h1>⭕ TIC TAC TOE ✕</h1>
<p style="text-align:center">Private 1v1 · Play and chat online</p>

<section class="card" id="lobby">
<h3>Play with a friend</h3>
<input id="playerName" placeholder="Enter your name" maxlength="18">
<div class="actions">
<button id="createBtn">Create Room</button>
<button id="showJoin">Join Room</button>
</div>
<div id="joinArea" class="hidden">
<input id="roomInput" placeholder="Enter 6-digit code" maxlength="6">
<button id="joinBtn">Join Game</button>
</div>
<p id="message" class="hint">Create a room and share the code with your friend.</p>
</section>

<section class="card hidden" id="game">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3>Private Game</h3>
<button id="leaveBtn">Leave</button>
</div>
<p class="hint">ROOM CODE</p>
<div class="roomcode" id="roomCode"></div>
<button id="copyBtn">Copy Code</button>

<div class="players">
<div class="player" id="playerX">
<h2 style="color:#79a0ff">X</h2>
<strong id="nameX">Player 1</strong>
<p id="scoreX">Wins: 0</p>
</div>
<div class="player" id="playerO">
<h2 style="color:#ff9bd1">O</h2>
<strong id="nameO">Player 2</strong>
<p id="scoreO">Wins: 0</p>
</div>
</div>

<div class="status" id="status">Waiting for friend...</div>

<div class="board">
<button class="cell" data-i="0"></button>
<button class="cell" data-i="1"></button>
<button class="cell" data-i="2"></button>
<button class="cell" data-i="3"></button>
<button class="cell" data-i="4"></button>
<button class="cell" data-i="5"></button>
<button class="cell" data-i="6"></button>
<button class="cell" data-i="7"></button>
<button class="cell" data-i="8"></button>
</div>

<div class="actions">
<button id="rematchBtn" disabled>Request Rematch</button>
<button id="newGameBtn">New Round</button>
</div>
<p id="roundMessage" class="hint"></p>
</section>

<section class="card hidden" id="chatCard">
<h3>💬 Live Chat</h3>
<div class="chatlog" id="chatLog"></div>
<div id="emojis">
<button class="emoji">😂</button>
<button class="emoji">❤️</button>
<button class="emoji">🔥</button>
<button class="emoji">😎</button>
<button class="emoji">👏</button>
<button class="emoji">🎉</button>
<button class="emoji">😭</button>
</div>
<form id="chatForm">
<input id="chatInput" placeholder="Write a message..." maxlength="250">
<button type="submit">Send</button>
</form>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// REPLACE THIS CONFIG WITH YOUR FIREBASE WEB APP CONFIG
const firebaseConfig = {
apiKey: "PASTE_YOUR_API_KEY",
authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
databaseURL: "https://PASTE_YOUR_DATABASE_URL",
projectId: "PASTE_YOUR_PROJECT_ID",
storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
appId: "PASTE_YOUR_APP_ID"
};

let db,uid,roomRef,roomId,mySymbol,roomData;
let chatItems=[];
let roomListener,chatListener;

const $=id=>document.getElementById(id);
const cells=[...document.querySelectorAll(".cell")];
const wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

async function connect(){
if(firebaseConfig.apiKey==="PASTE_YOUR_API_KEY")
throw Error("Please add your Firebase configuration first.");
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
await firebase.auth().signInAnonymously();
uid=firebase.auth().currentUser.uid;
db=firebase.database();
}

function enterRoom(code,symbol){
roomId=code;
mySymbol=symbol;
roomRef=db.ref("rooms/"+code);
$("roomCode").textContent=code;
$("lobby").classList.add("hidden");
$("game").classList.remove("hidden");
$("chatCard").classList.remove("hidden");
$("chatLog").innerHTML="";
chatItems=[];

roomListener=snap=>{
if(!snap.exists())return;
roomData=snap.val();
render();
};
roomRef.on("value",roomListener);

chatListener=snap=>{
chatItems.push(snap.val());
renderChat();
};
roomRef.child("chat").limitToLast(80).on("child_added",chatListener);
}

async function createRoom(){
let name=$("playerName").value.trim();
if(!name)return alert("Enter your name first.");
try{
await connect();
let code,ref,snap;
do{
code=String(Math.floor(100000+Math.random()*900000));
ref=db.ref("rooms/"+code);
snap=await ref.get();
}while(snap.exists());

await ref.set({
players:{X:{uid,name},O:null},
board:Array(9).fill(""),
turn:"X",
status:"waiting",
winner:null,
scores:{X:0,O:0},
round:1,
rematch:{X:false,O:false}
});
enterRoom(code,"X");
}catch(e){alert(e.message);}
}

async function joinRoom(){
let name=$("playerName").value.trim();
let code=$("roomInput").value.trim();
if(!name)return alert("Enter your name.");
if(!/^\d{6}$/.test(code))return alert("Enter the 6-digit code.");
try{
await connect();
let ref=db.ref("rooms/"+code);
let snap=await ref.get();
if(!snap.exists())return alert("Room not found.");
let data=snap.val();
if(data.players?.X?.uid===uid)return enterRoom(code,"X");
if(data.players?.O?.uid===uid)return enterRoom(code,"O");
if(data.players?.O)return alert("Room is full.");

let result=await ref.child("players/O").transaction(
current=>current===null?{uid,name}:undefined
);
if(!result.committed)return alert("Room is full.");
await ref.update({status:"playing"});
enterRoom(code,"O");
}catch(e){alert(e.message);}
}

function render(){
let p=roomData.players;
let board=roomData.board||Array(9).fill("");
$("nameX").textContent=p.X?.name||"Waiting...";
$("nameO").textContent=p.O?.name||"Waiting...";
$("scoreX").textContent="Wins: "+(roomData.scores?.X||0);
$("scoreO").textContent="Wins: "+(roomData.scores?.O||0);

$("playerX").classList.toggle("active",roomData.turn==="X"&&roomData.status==="playing");
$("playerO").classList.toggle("active",roomData.turn==="O"&&roomData.status==="playing");

let line=wins.find(l=>l.every(i=>board[i]&&board[i]===board[l[0]]));

cells.forEach((c,i)=>{
c.textContent=board[i]||"";
c.className="cell "+(board[i]==="X"?"x":board[i]==="O"?"o":"");
if(line?.includes(i))c.style.background="#28534a";
else c.style.background="#263252";
c.disabled=roomData.status!=="playing"||!!board[i]||roomData.turn!==mySymbol||!p.O;
});

if(!p.O)$("status").textContent="Waiting for your friend...";
else if(roomData.status==="finished")
$("status").textContent=roomData.winner==="draw"?"It's a draw!":"🏆 "+p[roomData.winner].name+" wins!";
else $("status").textContent=roomData.turn===mySymbol?"Your turn!":"Waiting for "+p[roomData.turn].name;

$("rematchBtn").disabled=roomData.status!=="finished"||!p.O;
$("newGameBtn").disabled=!p.O;
}

async function move(i){
if(!roomData||roomData.status!=="playing"||
roomData.turn!==mySymbol||roomData.board[i])return;

await roomRef.transaction(data=>{
if(!data||data.status!=="playing"||data.turn!==mySymbol||data.board[i])return;
let b=[...data.board];
b[i]=mySymbol;
data.board=b;

if(wins.some(l=>l.every(k=>b[k]===mySymbol))){
data.status="finished";
data.winner=mySymbol;
data.scores[mySymbol]=(data.scores[mySymbol]||0)+1;
}else if(b.every(Boolean)){
data.status="finished";
data.winner="draw";
}else{
data.turn=mySymbol==="X"?"O":"X";
}
return data;
});
}

async function nextRound(){
await roomRef.transaction(data=>{
if(!data||!data.players?.O)return;
data.board=Array(9).fill("");
data.turn="X";
data.status="playing";
data.winner=null;
data.round++;
data.rematch={X:false,O:false};
return data;
});
}

async function requestRematch(){
await roomRef.child("rematch/"+mySymbol).set(true);
let other=mySymbol==="X"?"O":"X";
let snap=await roomRef.child("rematch/"+other).get();
if(snap.val()===true)await nextRound();
else $("roundMessage").textContent="Waiting for your friend to agree...";
}

async function sendChat(text){
text=text.trim().slice(0,250);
if(!text||!roomRef)return;
await roomRef.child("chat").push({
uid,
name:roomData.players[mySymbol].name,
text,
createdAt:firebase.database.ServerValue.TIMESTAMP
});
}

function renderChat(){
let log=$("chatLog");
log.innerHTML="";
chatItems.slice(-80).forEach(m=>{
let div=document.createElement("div");
div.className="msg"+(m.uid===uid?" mine":"");
let name=document.createElement("b");
name.textContent=m.name+": ";
let text=document.createElement("span");
text.textContent=m.text;
div.append(name,text);
log.append(div);
});
log.scrollTop=log.scrollHeight;
}

function leave(){
if(roomRef){
roomRef.off("value",roomListener);
roomRef.child("chat").off("child_added",chatListener);
}
roomRef=null;
roomId=null;
roomData=null;
$("game").classList.add("hidden");
$("chatCard").classList.add("hidden");
$("lobby").classList.remove("hidden");
}

cells.forEach((c,i)=>c.addEventListener("click",()=>move(i)));
$("createBtn").onclick=createRoom;
$("showJoin").onclick=()=>$("joinArea").classList.toggle("hidden");
$("joinBtn").onclick=joinRoom;
$("leaveBtn").onclick=leave;
$("newGameBtn").onclick=nextRound;
$("rematchBtn").onclick=requestRematch;
$("copyBtn").onclick=()=>navigator.clipboard.writeText(roomId);
$("chatForm").onsubmit=e=>{
e.preventDefault();
let input=$("chatInput");
sendChat(input.value).then(()=>input.value="");
};
document.querySelectorAll(".emoji").forEach(b=>
b.onclick=()=>sendChat(b.textContent)
);
</script>
</body>
</html>
