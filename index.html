<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Matrix | Futuristic Profile</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Rajdhani for tech headings, Share Tech Mono for details -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #b537f2;
            --bg-dark: #030308;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden; /* Prevent scrolling, canvas handles background */
            margin: 0;
            padding: 0;
        }

        .font-mono {
            font-family: 'Share Tech Mono', monospace;
        }

        /* Canvas Background */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Main Content Wrapper */
        .content-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Glassmorphism Cyber Card */
        .cyber-card {
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), 
                        inset 0 0 20px rgba(181, 55, 242, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Scanning Line Effect */
        .cyber-card::before {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, transparent, var(--neon-cyan), transparent);
            opacity: 0.5;
            animation: scanline 4s linear infinite;
        }

        @keyframes scanline {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* Avatar Styling */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), 0 0 40px rgba(181, 55, 242, 0.2);
            animation: pulse-glow 3s ease-in-out infinite alternate;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid var(--bg-dark);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), 0 0 30px rgba(181, 55, 242, 0.2); }
            100% { box-shadow: 0 0 25px rgba(0, 243, 255, 0.6), 0 0 50px rgba(181, 55, 242, 0.4); }
        }

        /* Typography Glowing Effects */
        .text-glow-cyan {
            text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px rgba(0, 243, 255, 0.5);
        }

        /* Cyber Buttons */
        .btn-cyber {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, 95% 0, 100% 20%, 100% 100%, 5% 100%, 0 80%);
        }

        /* Instagram Button (Purple/Pink Accent) */
        .btn-ig {
            border-color: rgba(181, 55, 242, 0.5);
            border-left: 4px solid var(--neon-purple);
        }
        .btn-ig:hover {
            background: rgba(181, 55, 242, 0.15);
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(181, 55, 242, 0.5), inset 0 0 10px rgba(181, 55, 242, 0.2);
            text-shadow: 0 0 8px var(--neon-purple);
        }
        .btn-ig i { color: var(--neon-purple); }
        .btn-ig:hover i { text-shadow: 0 0 10px var(--neon-purple); }

        /* TikTok Button (Cyan Accent) */
        .btn-tk {
            border-color: rgba(0, 243, 255, 0.5);
            border-left: 4px solid var(--neon-cyan);
        }
        .btn-tk:hover {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5), inset 0 0 10px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 8px var(--neon-cyan);
        }
        .btn-tk i { color: var(--neon-cyan); }
        .btn-tk:hover i { text-shadow: 0 0 10px var(--neon-cyan); }

        /* Hover Glitch Effect Setup */
        .btn-cyber .hover-text {
            position: relative;
            z-index: 2;
        }

        /* Decorative Corners on Card */
        .corner {
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid transparent;
        }
        .corner-tl { top: 0; left: 0; border-top-color: var(--neon-cyan); border-left-color: var(--neon-cyan); }
        .corner-tr { top: 0; right: 0; border-top-color: var(--neon-purple); border-right-color: var(--neon-purple); }
        .corner-bl { bottom: 0; left: 0; border-bottom-color: var(--neon-purple); border-left-color: var(--neon-purple); }
        .corner-br { bottom: 0; right: 0; border-bottom-color: var(--neon-cyan); border-right-color: var(--neon-cyan); }
    </style>
</head>
<body>

    <!-- Dynamic Canvas Background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Main Content -->
    <main class="content-wrapper">
        <div class="cyber-card w-full max-w-md mx-auto p-8 rounded-lg">
            <!-- Decorative Corners -->
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

            <!-- Profile Section -->
            <div class="text-center mb-10">
                <div class="avatar-container mb-6">
                    <div class="avatar-inner">
                        <!-- Placeholder futuristic image -->
                        <img src="https://placehold.co/150x150/030308/00f3ff?text=SYS+OP" alt="Profile" class="w-full h-full object-cover mix-blend-screen opacity-90 hover:opacity-100 transition-opacity">
                    </div>
                </div>
                
                <h1 class="text-4xl font-bold text-white tracking-wider mb-2 text-glow-cyan">
                    NEXUS <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00f3ff] to-[#b537f2]">LINK</span>
                </h1>
                
                <div class="inline-block bg-black/50 border border-[#b537f2]/30 px-3 py-1 rounded text-sm font-mono text-[#b537f2] tracking-widest uppercase">
                    Status: <span class="text-[#00f3ff]">Online</span> // Initializing...
                </div>
            </div>

            <!-- Links Section -->
            <div class="flex flex-col gap-5">
                
                <!-- Instagram Link -->
                <a href="https://www.instagram.com/daily.aitool?exln=MWg0d3RlaXcxYjZtNg%3D%3D&utm_source=qr" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="btn-cyber btn-ig group">
                    <span class="flex items-center gap-3">
                        <i class="fab fa-instagram text-2xl transition-transform group-hover:scale-110"></i>
                        <span class="hover-text mt-1">Instagram</span>
                    </span>
                    <span class="font-mono text-xs opacity-70 group-hover:opacity-100 transition-opacity mt-1">daily.aitool</span>
                </a>

                <!-- TikTok Link -->
                <a href="https://www.tiktok.com/@ramadan_1431" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="btn-cyber btn-tk group">
                    <span class="flex items-center gap-3">
                        <i class="fab fa-tiktok text-2xl transition-transform group-hover:scale-110"></i>
                        <span class="hover-text mt-1">TikTok</span>
                    </span>
                    <span class="font-mono text-xs opacity-70 group-hover:opacity-100 transition-opacity mt-1">@ramadan_1431</span>
                </a>

            </div>

            <!-- Footer / System Data -->
            <div class="mt-10 pt-4 border-t border-white/10 flex justify-between items-center text-[10px] font-mono text-gray-500 uppercase tracking-widest">
                <span>SYS_VER: 9.4.2</span>
                <span>SEC_L: ALPHA</span>
                <span class="text-[#00f3ff] animate-pulse">CONN: ESTABLISHED</span>
            </div>
        </div>
    </main>

    <!-- Interactive Background Logic -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        // Configuration
        const particleCount = 70; // Adjust for density
        const connectionDistance = 120;
        const colors = ['#00f3ff', '#b537f2', '#ffffff'];

        // Mouse interaction
        let mouse = {
            x: null,
            y: null,
            radius: 150
        };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                
                // Velocity
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                // Add glow to particles
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // reset for lines
            }

            update() {
                // Movement
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interactivity (push away)
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouse.radius - distance) / mouse.radius;
                        const directionX = forceDirectionX * force * this.density;
                        const directionY = forceDirectionY * force * this.density;
                        
                        this.x -= directionX;
                        this.y -= directionY;
                    }
                }
            }
        }

        function connect() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        let opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(0, 243, 255, ${opacity * 0.2})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw a subtle gradient overlay
            let gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width/2);
            gradient.addColorStop(0, 'rgba(5, 5, 16, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 1)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            connect();
            requestAnimationFrame(animate);
        }

        // Handle resize
        window.addEventListener('resize', function() {
            init();
        });

        // Start
        init();
        animate();
    </script>
</body>
</html>
