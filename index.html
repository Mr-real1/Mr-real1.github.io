        :root {

            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

        /* Refined Glassmorphism Cyber Card - Less chunky, more elegant */
        .cyber-card {
            background: rgba(10, 10, 18, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 
                        inset 0 0 15px rgba(0, 243, 255, 0.03);
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }

        /* Scanning Line Effect - Subtler */
        .cyber-card::before {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--neon-cyan), transparent);
            opacity: 0.3;
            animation: scanline 6s linear infinite;
        }

        @keyframes scanline {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* Avatar Styling - Smoother glow */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
            100% { box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), 0 0 15px rgba(181, 55, 242, 0.2); }
        }

        /* Typography Glowing Effects */
        .text-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
        }

        /* Cyber Buttons - Cleaner, slightly rounded cut */
        .btn-cyber {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            transition: all 0.3s ease;
            /* Subtle cyber cut on bottom right */
            clip-path: polygon(0 0, 100% 0, 100% 75%, 97% 100%, 0 100%);

        /* YouTube Button */
        .btn-yt {

    <!-- Interactive Background Logic -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        // Configuration - Reduced particle count for a cleaner look
        const particleCount = 50; 
        const connectionDistance = 150;
        const colors = ['#00f3ff', '#b537f2', '#4a4a6a']; // Subtler colors

        // Mouse interaction tracker
        let mouse = { x: null, y: null, radius: 200 };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5; // Slightly smaller particles
                this.density = (Math.random() * 20) + 1;
                
                // Slower, smoother velocity
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouse.radius - distance) / mouse.radius;
                        const directionX = forceDirectionX * force * this.density;
                        const directionY = forceDirectionY * force * this.density;
                        
                        this.x -= directionX * 0.05; // Smoother mouse repel
                        this.y -= directionY * 0.05;
                    }
                }
            }
        }

        function connect() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        let opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(0, 243, 255, ${opacity * 0.15})`; // Softer lines
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Smoother gradient background
            let gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
            gradient.addColorStop(0, 'rgba(10, 10, 18, 1)');
            gradient.addColorStop(1, 'rgba(2, 2, 5, 1)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            connect();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        
        init();
        animate();
    </script>
